name: bewerbungs-helfer CI

on:
  push:
    branches: [main]
    paths:
      - 'bewerbungs-helfer/**'
      - '.github/workflows/bewerbungs-helfer-*.yml'
  pull_request:
    paths:
      - 'bewerbungs-helfer/**'
      - '.github/workflows/bewerbungs-helfer-*.yml'

defaults:
  run:
    working-directory: bewerbungs-helfer

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: file:./ci.db
      JWT_SECRET: ci-only-secret-not-used-anywhere-else-0123456789
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: bewerbungs-helfer/package-lock.json

      - run: npm ci
      - run: npm run setup
      - run: npm test

      - name: Smoke test
        run: |
          npm start &
          for i in $(seq 1 30); do curl -sf localhost:3000/api/health && break; sleep 1; done
          curl -sf localhost:3000/api/health/ready
          curl -sf localhost:3000/ | grep -qi '<title>'

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t bewerbungs-helfer .
