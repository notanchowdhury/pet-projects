[project]
name = "video-course-tracker"
version = "0.1.0"
description = "Track your progress through offline video courses stored on disk or in the browser."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Notan Chowdhury" }]
dependencies = [
    "fastapi>=0.115",
    "jinja2>=3.1",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
video-course-tracker = "app.main:run"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["templates/*.html", "static/css/*", "static/js/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
