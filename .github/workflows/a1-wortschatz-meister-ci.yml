name: a1-wortschatz-meister CI

on:
  push:
    branches: [main]
    paths:
      - 'a1-wortschatz-meister/**'
      - '.github/workflows/a1-wortschatz-meister-*.yml'
  pull_request:
    paths:
      - 'a1-wortschatz-meister/**'
      - '.github/workflows/a1-wortschatz-meister-*.yml'

defaults:
  run:
    working-directory: a1-wortschatz-meister

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: a1-wortschatz-meister/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npx tsc -p tsconfig.app.json --noEmit
      - run: npm run build
