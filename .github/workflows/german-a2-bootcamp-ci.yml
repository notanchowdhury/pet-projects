name: german-a2-bootcamp CI

on:
  push:
    branches: [main]
    paths:
      - 'german-a2-bootcamp/**'
      - '.github/workflows/german-a2-bootcamp-*.yml'
  pull_request:
    paths:
      - 'german-a2-bootcamp/**'
      - '.github/workflows/german-a2-bootcamp-*.yml'

defaults:
  run:
    working-directory: german-a2-bootcamp

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: german-a2-bootcamp/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npx tsc -p tsconfig.app.json --noEmit
      - run: npm run build
